[package]
name = "mivia-desktop"
edition.workspace = true
version.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]
e2e = []

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
arc-swap = "=1.9.2"
async-trait = "=0.1.92"
getrandom = "=0.4.3"
mivia-application.workspace = true
mivia-diagnostics.workspace = true
mivia-domain.workspace = true
mivia-os.workspace = true
mivia-preview.workspace = true
mivia-ports = { workspace = true, features = ["specta"] }
mivia-server.workspace = true
mivia-store.workspace = true
mivia-update-sig.workspace = true
parking_lot = "=0.12.5"
png = "=0.18.1"
secrecy = "=0.10.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.150"
specta = "=2.0.0-rc.25"
specta-typescript = "=0.0.12"
tauri = { version = "=2.12.1", features = ["protocol-asset", "tray-icon", "specta"] }
tauri-plugin-updater = { version = "=2.13.2", default-features = false, features = ["rustls-tls"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "=0.1.44"
uuid = { version = "=1.26.1", default-features = false, features = ["v7"] }

[dev-dependencies]
flate2 = "=1.1.10"
mivia-stub.workspace = true
mivia-testkit.workspace = true
tauri = { version = "=2.12.1", features = ["protocol-asset", "tray-icon", "specta", "test"] }
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["macros", "net"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }
