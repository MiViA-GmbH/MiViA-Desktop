name: promote

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to promote
        required: true
        type: string
      channel:
        description: Target channel
        required: true
        type: choice
        options: [stable, beta]
      skip_soak:
        description: Skip the 48 h soak check
        type: boolean
        default: false

permissions: {}

concurrency:
  group: channels
  cancel-in-progress: false

jobs:
  promote:
    name: Promote
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-bot
    permissions:
      contents: read  # check out the repository
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: api.github.com:443 github.com:443 release-assets.githubusercontent.com:443 objects.githubusercontent.com:443
      - name: Validate the tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: printf '%s' "$TAG" | grep -Pq '^(beta-)?v\d+\.\d+\.\d+(-beta\.\d+)?$'
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Soak check and channel change
        env:
          TAG: ${{ inputs.tag }}
          CHANNEL: ${{ inputs.channel }}
          SKIP_SOAK: ${{ inputs.skip_soak }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: node scripts/ci/channel.mjs "$CHANNEL"
      - name: Pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app.outputs.token }}
          branch: bot/channel-promote
          title: "chore(release): promote a release to a channel"
          sign-commits: true
