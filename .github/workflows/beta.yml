name: beta

on:
  workflow_dispatch:
    inputs:
      perf_override_reason:
        description: Release despite a red performance gate, and why
        type: string
        default: ""

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Beta tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-bot
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    permissions:
      contents: read  # check out the repository
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: api.github.com:443 github.com:443
      - name: Only from main
        shell: bash
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Create tag and draft prerelease
        id: tag
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: node scripts/ci/beta-tag.mjs

  build:
    name: Build beta
    needs: [tag]
    permissions:
      contents: write  # upload release assets
      actions: read  # read nightly perf results
      issues: read  # read perf-red issues
      id-token: write  # OIDC for signing and attestations
      attestations: write  # write build provenance
      artifact-metadata: write  # attach attestation metadata
    uses: ./.github/workflows/build-release.yml
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    with:
      tag_name: ${{ needs.tag.outputs.tag }}
      sha: ${{ github.sha }}
      perf_override_reason: ${{ inputs.perf_override_reason }}
