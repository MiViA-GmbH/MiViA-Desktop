name: weekly

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  mutants:
    name: Mutants (application, store)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    permissions:
      contents: read  # check out the repository
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchains
        uses: ./.github/actions/setup
        with:
          profile: ubuntu-ci
          rust: "true"
      - name: Install cargo-mutants
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-mutants@25.3.1
          fallback: none
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest@0.9.148
          fallback: none
      - name: Mutants shard
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          status=0
          cargo mutants -p mivia-application -p mivia-store -p mivia-it --test-tool nextest --shard "$SHARD/6" || status=$?
          case "$status" in 0|2|3) ;; *) exit "$status" ;; esac
      - name: Upload mutants-shard-${{ matrix.shard }}
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: |
            mutants.out/outcomes.json
            mutants.out/missed.txt
            mutants.out/timeout.txt
          retention-days: 14

  mutants-floors:
    name: Mutants
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        crate: [mivia-domain, mivia-server, mivia-diagnostics]
    permissions:
      contents: read  # check out the repository
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchains
        uses: ./.github/actions/setup
        with:
          profile: ubuntu-ci
          rust: "true"
      - name: Install cargo-mutants
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-mutants@25.3.1
          fallback: none
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest@0.9.148
          fallback: none
      - name: Mutants
        shell: bash
        env:
          CRATE: ${{ matrix.crate }}
          NEXTEST_TEST_THREADS: 2
        run: |
          status=0
          cargo mutants -p "$CRATE" --test-tool nextest --jobs 2 || status=$?
          case "$status" in 0|2|3) ;; *) exit "$status" ;; esac
          cargo xtask mutation-floor "$CRATE" mutants.out/outcomes.json
      - name: Upload mutants-${{ matrix.crate }}
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-${{ matrix.crate }}
          path: |
            mutants.out/outcomes.json
            mutants.out/missed.txt
            mutants.out/timeout.txt
          retention-days: 14

  stryker:
    name: Stryker
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read  # check out the repository
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchains
        uses: ./.github/actions/setup
        with:
          profile: ubuntu-ci
          rust: "false"
      - name: Install node packages
        run: pnpm install --frozen-lockfile
      - name: Mutation
        env:
          TZ: Europe/Berlin
        run: pnpm --filter @mivia-desktop/ui exec stryker run

  fuzz-cmin:
    name: Fuzz corpus minimisation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read  # check out the repository
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchains
        uses: ./.github/actions/setup
        with:
          profile: fuzz
          rust: "true"
      - name: Install the fuzz toolchain
        working-directory: fuzz
        run: rustup toolchain install --no-self-update
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version =0.13.2 --locked
      - name: Minimise
        run: cargo xtask fuzz --cmin

  floors-raise:
    name: Raise floors
    needs: [mutants-floors]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-bot
    permissions:
      actions: read  # download the mutation results of this run
      contents: read  # check out the repository
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchains
        uses: ./.github/actions/setup
        with:
          profile: ubuntu-ci
          rust: "true"
      - name: App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Raise
        run: cargo xtask floors-lower
      - name: Raise mutation floors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for crate in mivia-domain mivia-server mivia-diagnostics; do
            gh run download "$GITHUB_RUN_ID" --name "mutants-$crate" --dir "$RUNNER_TEMP/mutants/$crate"
            cargo xtask mutation-floor "$crate" "$RUNNER_TEMP/mutants/$crate/outcomes.json" --raise
          done
      - name: Pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app.outputs.token }}
          branch: bot/floors-raise
          title: "chore(ci): raise quality floors"
          sign-commits: true

  report:
    name: Weekly report
    needs: [mutants, mutants-floors, stryker, fuzz-cmin, floors-raise]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read  # check out the repository
      issues: write  # open or update nightly-red issues
      actions: read  # read the job results of this run
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: api.github.com:443 github.com:443
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/nightly-report.mjs
