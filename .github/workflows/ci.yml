name: ci

on:
  pull_request:
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ github.event_name == 'merge_group' || steps.docs.outputs.code == 'true' }}
      rust: ${{ github.event_name == 'merge_group' || steps.f.outputs.rust == 'true' || steps.f.outputs.global == 'true' }}
      e2e: ${{ github.event_name == 'merge_group' || steps.f.outputs.e2e == 'true' || steps.f.outputs.global == 'true' }}
    permissions:
      pull-requests: read  # list the changed files
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: github.com:443 api.github.com:443
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Code paths
        id: docs
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code: ['**', '!docs/**', '!**/*.md', '!.github/ISSUE_TEMPLATE/**']
      - name: Area paths
        id: f
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/filters.yml

  repo-checks:
    name: Repository checks
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read  # check out the repository
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchains
        uses: ./.github/actions/setup
        with:
          profile: ubuntu-ci
          rust: "true"
      - name: Install cargo-deny
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - name: Install cargo-machete
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-machete@0.9.2
          fallback: none
      - name: Install zizmor
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: zizmor@1.30.1
          fallback: none
      - name: Install actionlint
        run: bash scripts/ci/install-actionlint.sh
      - name: Install node packages
        run: pnpm install --frozen-lockfile
      - name: Checks
        run: node scripts/check.mjs source-rules arch command-size canary machete jscpd deny ci-integrity actionlint zizmor

  ui:
    name: UI
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read  # check out the repository
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchains
        uses: ./.github/actions/setup
        with:
          profile: ubuntu-ci
          rust: "false"
      - name: Install node packages
        run: pnpm install --frozen-lockfile
      - name: Checks
        run: node scripts/check.mjs biome tsc fallow size audit
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml
          comment-summary-in-pr: never

  coverage:
    name: Coverage
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read  # check out the repository
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchains
        uses: ./.github/actions/setup
        with:
          profile: ubuntu-cov
          rust: "true"
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-llvm-cov@0.6.21
          fallback: none
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest@0.9.148
          fallback: none
      - name: Coverage
        env:
          TZ: Pacific/Chatham
        run: cargo llvm-cov nextest --workspace --exclude mivia-desktop --exclude mivia-os --locked --json --summary-only --output-path target/coverage.json

  mutants-domain:
    name: Mutants (domain)
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read  # check out the repository
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up toolchains
        uses: ./.github/actions/setup
        with:
          profile: ubuntu-ci
          rust: "true"
      - name: Install cargo-mutants
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-mutants@25.3.1
          fallback: none
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest@0.9.148
          fallback: none
      - name: Mutants in the diff
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          git diff "$BASE_SHA"...HEAD > target-pr.diff
          cargo mutants --in-diff target-pr.diff -p mivia-domain --test-tool nextest

  perf-instr:
    name: Performance (instruction counts)
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read  # check out the repository
      actions: read  # find the baseline artifact of main
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchains
        uses: ./.github/actions/setup
        with:
          profile: ubuntu-bench
          rust: "true"
      - name: Instruction counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask perf instr

  test-core-windows:
    name: Core tests (Windows)
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-2025
    timeout-minutes: 35
    permissions:
      contents: read  # check out the repository
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchains
        uses: ./.github/actions/setup
        with:
          profile: windows-ci
          rust: "true"
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest@0.9.148
          fallback: none
      - name: Checks
        run: node scripts/check.mjs fmt lint lint-tests
      - name: Tests
        shell: bash
        run: cargo nextest run --cargo-profile ci --profile ci-windows -E "$(cargo xtask quarantine-filter windows)"
      - name: Upload junit-windows
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-windows
          path: target/nextest/ci-windows/junit.xml
          retention-days: 7

  e2e:
    name: End to end
    needs: [changes]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read  # check out the repository
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchains
        uses: ./.github/actions/setup
        with:
          profile: windows-e2e
          rust: "true"
      - name: Install node packages
        run: pnpm install --frozen-lockfile
      - name: Build
        run: cargo xtask e2e build
      - name: Smoke
        run: cargo xtask e2e smoke
      - name: Upload e2e-artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-artifacts
          path: target/e2e-artifacts
          retention-days: 7

  playwright-visual:
    name: Visual regression
    needs: [changes]
    if: github.event_name == 'merge_group'
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read  # check out the repository
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchains
        uses: ./.github/actions/setup
        with:
          profile: windows-ci
          rust: "false"
      - name: Install node packages
        run: pnpm install --frozen-lockfile
      - name: Visual tests
        run: pnpm --filter @mivia-desktop/ui test:visual

  gate:
    name: gate
    needs: [changes, repo-checks, ui, coverage, mutants-domain, perf-instr, test-core-windows, e2e, playwright-visual]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: github.com:443
      - name: All required jobs passed or were skipped by design
        env:
          NEEDS: ${{ toJSON(needs) }}
          SKIPPABLE: '["repo-checks","ui","coverage","mutants-domain","perf-instr","test-core-windows","e2e","playwright-visual"]'
        run: |
          echo "$NEEDS" | jq -e --argjson skippable "$SKIPPABLE" \
            '.changes.result == "success" and (to_entries | all(.value.result == "success" or
            (.value.result == "skipped" and (.key as $k | $skippable | index($k) != null))))'
