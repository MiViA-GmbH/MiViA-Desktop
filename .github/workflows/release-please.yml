name: release-please

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-bot
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    permissions: {}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: api.github.com:443 github.com:443
      - name: App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Release please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}

  build:
    name: Build release
    needs: [release-please]
    if: needs.release-please.outputs.created == 'true'
    permissions:
      contents: read  # check out the repository
      actions: read  # read nightly perf results
      issues: read  # read perf-red issues
      id-token: write  # OIDC for attestations
      attestations: write  # write build provenance
      artifact-metadata: write  # attach attestation metadata
    uses: ./.github/workflows/build-release.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag }}
