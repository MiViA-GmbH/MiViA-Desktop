name: nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read  # check out the repository
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchains
        uses: ./.github/actions/setup
        with:
          profile: ubuntu-ci
          rust: "true"
      - name: Install cargo-deny
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - name: Install node packages
        run: pnpm install --frozen-lockfile
      - name: Audit
        run: node scripts/check.mjs deny deny-fuzz deny-perf audit

  release-build:
    name: Release build (unsigned)
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read  # check out the repository
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchains without cache
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        env:
          RUSTUP_AUTO_INSTALL: "0"
        with:
          proto-version: "0.62.3"
          auto-install: true
          cache: false
      - name: Install node packages
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm tauri build --bundles nsis --config src-tauri/tauri.release.conf.json
      - name: Upload nightly-release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-release
          path: target/release/bundle/nsis
          retention-days: 14

  perf-start-idle-window:
    name: Performance (start, idle, window)
    needs: [release-build]
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read  # check out the repository
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchains
        uses: ./.github/actions/setup
        with:
          profile: windows-ci
          rust: "true"
      - name: Install node packages
        run: pnpm install --frozen-lockfile
      - name: Build the measured app
        run: node scripts/e2e.mjs --build-only
      - name: Download the nightly build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-release
          path: target/nightly
      - name: Scenarios
        run: cargo xtask perf start-idle-window --installer target/nightly
      - name: Upload perf-perf-start-idle-window
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-perf-start-idle-window
          path: target/perf
          retention-days: 7

  perf-io:
    name: Performance (io)
    needs: [release-build]
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read  # check out the repository
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchains
        uses: ./.github/actions/setup
        with:
          profile: windows-ci
          rust: "true"
      - name: Install node packages
        run: pnpm install --frozen-lockfile
      - name: Build the measured app
        run: node scripts/e2e.mjs --build-only
      - name: Download the nightly build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-release
          path: target/nightly
      - name: Scenarios
        run: cargo xtask perf io --installer target/nightly
      - name: Upload perf-perf-io
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-perf-io
          path: target/perf
          retention-days: 7

  perf-preview:
    name: Performance (preview)
    needs: [release-build]
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read  # check out the repository
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchains
        uses: ./.github/actions/setup
        with:
          profile: windows-ci
          rust: "true"
      - name: Install node packages
        run: pnpm install --frozen-lockfile
      - name: Build the measured app
        run: node scripts/e2e.mjs --build-only
      - name: Download the nightly build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-release
          path: target/nightly
      - name: Scenarios
        run: cargo xtask perf preview --installer target/nightly
      - name: Upload perf-perf-preview
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-perf-preview
          path: target/perf
          retention-days: 7

  release-artifact-smoke:
    name: Release artifact smoke
    needs: [release-build]
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read  # check out the repository
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchains
        uses: ./.github/actions/setup
        with:
          profile: windows-ci
          rust: "true"
      - name: Install node packages
        run: pnpm install --frozen-lockfile
      - name: Build the measured app
        run: node scripts/e2e.mjs --build-only
      - name: Download the nightly build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-release
          path: target/nightly
      - name: Scenarios
        run: cargo xtask perf smoke --installer target/nightly
      - name: Upload perf-release-artifact-smoke
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-release-artifact-smoke
          path: target/perf
          retention-days: 7

  e2e-full:
    name: End to end (full)
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    permissions:
      contents: read  # check out the repository
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchains
        uses: ./.github/actions/setup
        with:
          profile: windows-e2e
          rust: "true"
      - name: Install node packages
        run: pnpm install --frozen-lockfile
      - name: Full scenarios
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: node scripts/e2e.mjs --shard "$SHARD/2"

  windows-os:
    name: Windows OS adapter
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read  # check out the repository
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchains
        uses: ./.github/actions/setup
        with:
          profile: windows-ci
          rust: "true"
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest@0.9.148
          fallback: none
      - name: Tests
        run: cargo nextest run --cargo-profile ci -p mivia-os --run-ignored all

  ubuntu-deep:
    name: Deep property tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read  # check out the repository
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchains
        uses: ./.github/actions/setup
        with:
          profile: ubuntu-ci
          rust: "true"
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest@0.9.148
          fallback: none
      - name: Random seed
        env:
          PROPTEST_CASES: 10000
        run: cargo nextest run --cargo-profile ci --workspace --exclude mivia-desktop --exclude mivia-os
      - name: German locale and UTC
        env:
          TZ: UTC
          LANG: de_DE.UTF-8
        run: cargo nextest run --cargo-profile ci --workspace --exclude mivia-desktop --exclude mivia-os

  fuzz:
    name: Fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    permissions:
      contents: read  # check out the repository
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchains
        uses: ./.github/actions/setup
        with:
          profile: fuzz
          rust: "true"
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version =0.13.2 --locked
      - name: Fuzz
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: cargo xtask fuzz --shard "$SHARD/3" --seconds 600

  mutants:
    name: Mutants
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        crate: [mivia-domain, mivia-server, mivia-diagnostics]
    permissions:
      contents: read  # check out the repository
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchains
        uses: ./.github/actions/setup
        with:
          profile: ubuntu-ci
          rust: "true"
      - name: Install cargo-mutants
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-mutants@25.3.1
          fallback: none
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest@0.9.148
          fallback: none
      - name: Mutants
        shell: bash
        env:
          CRATE: ${{ matrix.crate }}
        run: cargo mutants -p "$CRATE" --test-tool nextest

  checks:
    name: Release consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read  # check out the repository
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: api.github.com:443 github.com:443 updates.mivia.ai:443 release-assets.githubusercontent.com:443 objects.githubusercontent.com:443
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tags, releases and live channels
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/nightly-checks.mjs

  report:
    name: Nightly report
    needs: [audit, release-build, perf-start-idle-window, perf-io, perf-preview, release-artifact-smoke, e2e-full, windows-os, ubuntu-deep, fuzz, mutants, checks]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read  # check out the repository
      issues: write  # open or update nightly-red and perf-red issues
      actions: read  # download nightly results
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: api.github.com:443 github.com:443
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/nightly-report.mjs
