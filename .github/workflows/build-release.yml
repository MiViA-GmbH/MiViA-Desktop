name: build-release

on:
  workflow_call:
    inputs:
      tag_name:
        type: string
        required: true
      sha:
        type: string
        required: true
      perf_override_reason:
        type: string
        default: ""
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true

permissions: {}

jobs:
  perf-gate:
    name: Performance gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read  # check out the repository
      actions: read  # read nightly perf results
      issues: read  # read perf-red issues
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: api.github.com:443 github.com:443
      - name: Validate the tag
        shell: bash
        env:
          TAG: ${{ inputs.tag_name }}
        run: printf '%s' "$TAG" | grep -Pq '^(beta-)?v\d+\.\d+\.\d+(-beta\.\d+)?$'
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Gate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag_name }}
          OVERRIDE: ${{ inputs.perf_override_reason }}
        run: node scripts/ci/perf-gate.mjs

  compile:
    name: Compile
    needs: [perf-gate]
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      digests: ${{ steps.digests.outputs.digests }}
    permissions:
      contents: read  # check out the repository
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchains without cache
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        env:
          RUSTUP_AUTO_INSTALL: "0"
        with:
          proto-version: "0.62.3"
          auto-install: true
          cache: false
      - name: Fetch
        run: cargo fetch --locked
      - name: Build
        id: digests
        env:
          TAG: ${{ inputs.tag_name }}
        run: node scripts/ci/release-compile.mjs
      - name: Upload compile-out
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compile-out
          path: out
          retention-days: 1

  package:
    name: Package and sign
    needs: [compile]
    runs-on: windows-2025
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write  # upload release assets
      id-token: write  # OIDC for attestations
      attestations: write  # write build provenance
      artifact-metadata: write  # attach attestation metadata
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Only the release commit on main
        shell: bash
        env:
          TAG_SHA: ${{ inputs.sha }}
        run: test "$GITHUB_REF" = refs/heads/main && test "$GITHUB_SHA" = "$TAG_SHA"
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download compile output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compile-out
          path: out
      - name: Verify digests
        shell: bash
        env:
          EXPECTED: ${{ needs.compile.outputs.digests }}
        run: cd out && sha256sum -c <<< "$EXPECTED"
      - name: Place the compiled app
        shell: bash
        run: mkdir -p target/release && cp out/mivia-desktop.exe target/release/ && cp out/package.json package.json
      - name: Bundle
        shell: pwsh
        run: out/cargo-tauri.exe bundle --bundles nsis --config src-tauri/tauri.release.conf.json
      - name: Sign for the updater
        shell: bash
        env:
          TAG: ${{ inputs.tag_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: bash scripts/ci/sign-installer.sh
      - name: Check the updater signature
        shell: bash
        env:
          TAG: ${{ inputs.tag_name }}
        run: for exe in target/release/bundle/nsis/*-setup.exe; do out/xtask.exe update-sig verify "$exe" "$exe.sig" "$TAG"; done
      - name: Provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig
            out/*.cdx.json
      - name: SBOM names
        id: sbom
        shell: bash
        env:
          TAG: ${{ inputs.tag_name }}
        run: |
          version="${TAG#beta-}"
          version="${version#v}"
          echo "cargo=out/mivia-desktop-$version-cargo.cdx.json" >> "$GITHUB_OUTPUT"
          echo "npm=out/mivia-desktop-$version-npm.cdx.json" >> "$GITHUB_OUTPUT"
      - name: Cargo SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/release/bundle/nsis/*-setup.exe
          sbom-path: ${{ steps.sbom.outputs.cargo }}
      - name: npm SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/release/bundle/nsis/*-setup.exe
          sbom-path: ${{ steps.sbom.outputs.npm }}
      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag_name }}
        run: gh release upload "$TAG" target/release/bundle/nsis/*-setup.exe target/release/bundle/nsis/*-setup.exe.sig out/*.cdx.json

  verify:
    name: Verify
    needs: [package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write  # read the assets of the draft release
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: api.github.com:443 github.com:443 release-assets.githubusercontent.com:443 objects.githubusercontent.com:443 tuf-repo-cdn.sigstore.dev:443
      - name: Validate the tag
        shell: bash
        env:
          TAG: ${{ inputs.tag_name }}
        run: printf '%s' "$TAG" | grep -Pq '^(beta-)?v\d+\.\d+\.\d+(-beta\.\d+)?$'
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Attestations
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag_name }}
          REPO: ${{ github.repository }}
        run: bash scripts/ci/verify-release.sh
