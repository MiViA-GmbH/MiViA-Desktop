# Performance budgets (reference laptop: 4C/8T 2021 mobile CPU, 8 GB, iGPU, NVMe).
# A tbc row stays report-only until 14 nightly samples on one CPU model, then it is set once
# to min(provisional, measured p90 x 1.25) and switched to block or two-night. Budgets only go down.

["start.tray.median"]
metric = "process creation to tray_ready, warm"
unit = "ms"
direction = "max"
