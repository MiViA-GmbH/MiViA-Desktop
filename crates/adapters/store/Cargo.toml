[package]
name = "mivia-store"
edition.workspace = true
version.workspace = true
publish.workspace = true
rust-version.workspace = true
autotests = false

[lints]
workspace = true

[dependencies]
async-trait = "=0.1.92"
mivia-domain.workspace = true
mivia-ports.workspace = true
rusqlite = { version = "=0.40.2", features = ["backup", "bundled"] }
rusqlite_migration = "=2.6.0"
serde_json = "=1.0.150"
tokio = { version = "=1.53.3", features = ["sync"] }
tokio-rusqlite = "=0.8.0"

[dev-dependencies]
insta = { version = "=1.48.0", features = ["yaml"] }
proptest = "=1.11.0"
tempfile = "=3.27.0"
tokio = { version = "=1.53.3", features = ["macros", "rt"] }

[[test]]
name = "store"
path = "tests/main.rs"
