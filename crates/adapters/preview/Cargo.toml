[package]
name = "mivia-preview"
edition.workspace = true
version.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
async-trait = "=0.1.92"
fast_image_resize = "=6.1.0"
image = { version = "=0.25.10", default-features = false, features = ["bmp", "jpeg", "png", "tiff"] }
jpeg-decoder = { version = "=0.3.2", default-features = false }
jpeg-encoder = "=0.7.1"
mivia-domain.workspace = true
mivia-ports.workspace = true
sha2 = "=0.11.0"
tokio = { version = "=1.53.3", features = ["rt", "sync"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }

[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false }
png = "=0.18.1"
parking_lot = "=0.12.5"
tempfile = "=3.27.0"
tiff = "=0.11.3"
tokio = { version = "=1.53.3", features = ["macros", "rt", "sync", "time"] }

[[bench]]
name = "render"
harness = false
