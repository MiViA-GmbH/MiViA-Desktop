[package]
name = "mivia-server"
edition.workspace = true
version.workspace = true
publish.workspace = true
rust-version.workspace = true
autotests = false

[lints]
workspace = true

[dependencies]
arc-swap = "=1.9.2"
async-trait = "=0.1.92"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
httpdate = "=1.0.3"
mivia-api.workspace = true
mivia-domain.workspace = true
mivia-ports.workspace = true
parking_lot = "=0.12.5"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "json", "stream", "multipart"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "=0.7.1"
secrecy = "=0.10.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.150"
tokio = { version = "=1.53.1", features = ["macros", "sync", "time"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
uuid = { version = "=1.26.1", default-features = false }

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["macros", "rt", "net", "io-util", "sync", "time", "test-util"] }
tempfile = "=3.27.0"
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
wiremock = "=0.6.5"

[[test]]
name = "server"
path = "tests/main.rs"
