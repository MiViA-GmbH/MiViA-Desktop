[package]
name = "mivia-api"
edition.workspace = true
version.workspace = true
publish.workspace = true
rust-version.workspace = true
autotests = false

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["serde", "std"] }
http = "=1.5.0"
progenitor-client = "=0.15.0"
regress = "=0.12.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "multipart", "query", "stream"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.150"
uuid = { version = "=1.26.1", default-features = false, features = ["serde"] }

[build-dependencies]
prettyplease = "=0.2.37"
proc-macro2 = { version = "=1.0.107", default-features = false }
progenitor = { version = "=0.15.0", default-features = false }
serde_json = "=1.0.150"
syn = { version = "=2.0.118", default-features = false, features = ["full", "parsing", "printing"] }

[[test]]
name = "api"
path = "tests/main.rs"

