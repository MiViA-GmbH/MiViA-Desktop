[package]
name = "mivia-diagnostics"
edition.workspace = true
version.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
mivia-domain.workspace = true
mivia-ports.workspace = true
logroller = "=0.1.12"
parking_lot = "=0.12.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.150"
tracing = { version = "=0.1.44", features = ["release_max_level_debug"] }
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "json", "registry", "std"] }
uuid = { version = "=1.26.1", default-features = false, features = ["v4"] }

[dev-dependencies]
tempfile = "=3.27.0"
