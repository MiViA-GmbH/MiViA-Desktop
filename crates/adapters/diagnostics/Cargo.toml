[package]
name = "mivia-diagnostics"
edition.workspace = true
version.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["logging"]
logging = ["dep:logroller", "dep:tracing-appender", "dep:tracing-subscriber"]

[dependencies]
flate2 = "=1.1.9"
getrandom = "=0.4.3"
hmac = "=0.13.0"
logroller = { version = "=0.1.12", optional = true }
mivia-domain.workspace = true
mivia-ports.workspace = true
parking_lot = "=0.12.5"
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"
toml = "=1.1.6"
tracing = { version = "=0.1.44", default-features = false, features = ["std", "release_max_level_debug"] }
tracing-appender = { version = "=0.2.5", optional = true }
tracing-subscriber = { version = "=0.3.23", optional = true, default-features = false, features = ["fmt", "json", "registry", "std"] }
uuid = { version = "=1.26.1", default-features = false, features = ["v4"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
flate2 = "=1.1.9"
proptest = "=1.11.0"
tempfile = "=3.27.0"
