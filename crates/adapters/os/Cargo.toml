[package]
name = "mivia-os"
edition.workspace = true
version.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "=0.1.92"
iana-time-zone = "=0.1.65"
keyring-core = "=1.0.0"
mivia-domain.workspace = true
mivia-ports.workspace = true
notify = { version = "=9.0.0-rc.5", default-features = false }
parking_lot = "=0.12.5"
secrecy = "=0.10.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"
sys-locale = "=0.3.2"
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["rt", "time"] }
walkdir = "=2.5.0"
winreg = "=0.55.0"
windows = { version = "=0.62.2", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
webview2-com = "=0.39.1"
windows-core = "=0.62.2"
windows-native-keyring-store = { version = "=1.1.0", default-features = false }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
