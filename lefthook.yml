pre-commit:
  parallel: true
  skip: [merge, rebase]
  jobs:
    - name: biome
      glob: "*.{ts,tsx,js,mjs,json,css,html,grit}"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: rustfmt
      glob: "*.rs"
      run: cargo fmt --all --check
    - name: source-rules
      glob: "*.{rs,ts,tsx,js,mjs,css,sql,html}"
      run: cargo xtask source-rules {staged_files}
    - name: cargo-manifests
      glob: "{**/Cargo.toml,Cargo.toml,Cargo.lock}"
      run: node scripts/check.mjs machete arch

commit-msg:
  jobs:
    - name: commit-text
      run: cargo xtask commit-text --file {1}

pre-push:
  jobs:
    - name: check
      run: pnpm check
