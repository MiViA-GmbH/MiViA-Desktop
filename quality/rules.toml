id = "suppression-budget"
why = "Suppressions only go down; quality/floors.toml holds the budget."
instead = "Fix the code instead of suppressing."
adr = "0009-code-shape-rules-are-machine-enforced.md"

[[rule]]
id = "generated-list"
why = "Generated files are excluded in one place only."
instead = "Keep quality/generated.toml and the tool configs in sync."
adr = "0009-code-shape-rules-are-machine-enforced.md"

[[rule]]
id = "rules-registry"
why = "Every rule has a recorded reason."
instead = "Add the rule to quality/rules.toml."
adr = "0009-code-shape-rules-are-machine-enforced.md"

[[rule]]
id = "if-value"
why = "An if used as a value must stay as simple as a ternary."
instead = "Use a match, a named function or an early return."
adr = "0009-code-shape-rules-are-machine-enforced.md"

[[rule]]
id = "determinism"
why = "Core code reaches time, files and the environment only through ports."
instead = "Inject the port."
adr = "0003-crate-boundaries-enforced-by-xtask.md"
grep = ["std::fs", "tokio::fs", "std::env", "SystemTime", "thread::sleep"]
scope = ["crates/core/"]
extensions = ["rs"]

[[rule]]
id = "time-begin-period"
why = "Raising the timer resolution drains laptop batteries."
instead = "Keep the default timer resolution."
adr = "0009-code-shape-rules-are-machine-enforced.md"
grep = ["timeBeginPeriod"]

[[rule]]
id = "pkg-version"
why = "The version lives in the root package.json, not in Cargo manifests."
instead = "Read the version the shell embeds at build time."
adr = "0009-code-shape-rules-are-machine-enforced.md"
grep = ["CARGO_PKG_VERSION"]
extensions = ["rs"]

[[rule]]
id = "tls-bypass"
why = "TLS verification and redirects are never relaxed."
instead = "Keep the platform verifier and redirects off."
adr = "0009-code-shape-rules-are-machine-enforced.md"
grep = ["danger_accept_invalid"]
extensions = ["rs"]

[[rule]]
id = "arch"
why = "Crate boundaries keep the core independent of IO."
instead = "Depend only on the crates the rule table allows."
adr = "0003-crate-boundaries-enforced-by-xtask.md"

[[rule]]
id = "command-size"
why = "Tauri commands stay thin so logic lives in tested use cases."
instead = "Move the logic into a use case."
adr = "0003-crate-boundaries-enforced-by-xtask.md"

[[rule]]
id = "quality-diff"
why = "Gates are never loosened in a pull request."
instead = "Fix the code and record the friction in quality/retro.md."
adr = "0046-quality-relaxation-guard-built-from-base.md"

[[rule]]
id = "ci-integrity"
why = "Workflows must keep their security and gate shape."
instead = "Follow the workflow rules of the CI design."
adr = "0046-quality-relaxation-guard-built-from-base.md"

[[rule]]
id = "commit-text"
why = "Commit text follows Conventional Commits and carries no co-author, session or generator trailers."
instead = "Write type(scope): subject in lowercase, without attribution lines."
adr = "0009-code-shape-rules-are-machine-enforced.md"
patterns = ["co-authored-by:", "-session:", "generated with"]

[[rule]]
id = "canary"
why = "A rule that never fires on a planted violation protects nothing."
instead = "Fix the tool configuration until the canary fails as expected."
adr = "0009-code-shape-rules-are-machine-enforced.md"

[[rule]]
id = "sql-now"
why = "Every current time reaches SQL as a bound parameter from the Clock port, so tests control time."
instead = "Bind the timestamp from Clock::now."
adr = "0003-crate-boundaries-enforced-by-xtask.md"
grep = ["datetime('now')", "unixepoch(", "CURRENT_TIMESTAMP", "julianday('now')"]
scope = ["crates/adapters/store/"]
extensions = ["sql", "rs"]
